<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">照片足迹 Photo Atlas — 把硬盘里的照片变成去过哪里、何时重逢的城市地图</title>
  <desc id="desc">暖米纸底：左上标题照片足迹；右侧深色地球仪，绿色陆块上标着上海、成都、东京、悉尼四个城市定位点。</desc>

  <rect width="1200" height="360" rx="26" fill="#f5f1e6"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#5c6b52">本地照片地图 · LOCAL PHOTO MAP</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1e2b1e">照片足迹</text>
    <text x="56" y="168" font-size="23" fill="#3d4a38">PHOTO ATLAS — 去过哪里，何时重逢</text>
    <text x="56" y="204" font-size="19" fill="#5c6b52">扫描本地照片，变成一张城市地图；原图不出本机。</text>
    <g id="chips" font-size="18" fill="#1e2b1e" text-anchor="middle">
      <g><rect x="56" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#d8d2ba" stroke-width="1.5"/><text x="131" y="262">本地扫描不上传</text></g>
      <g><rect x="218" y="238" width="186" height="36" rx="18" fill="#ffffff" stroke="#d8d2ba" stroke-width="1.5"/><text x="311" y="262">地球仪 + 平面地图</text></g>
      <g><rect x="416" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#d8d2ba" stroke-width="1.5"/><text x="491" y="262">多年照片报告</text></g>
      <g><rect x="578" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#d8d2ba" stroke-width="1.5"/><text x="653" y="262">足迹分享卡</text></g>
    </g>
  </g>

  <g id="globe">
    <circle cx="964" cy="180" r="132" fill="#12261f"/>
    <g id="graticule" stroke="#2a4a3a" stroke-width="1.5" fill="none">
      <ellipse cx="964" cy="180" rx="132" ry="48"/>
      <ellipse cx="964" cy="180" rx="132" ry="96"/>
      <ellipse cx="964" cy="180" rx="48" ry="132"/>
      <ellipse cx="964" cy="180" rx="96" ry="132"/>
      <line x1="832" y1="180" x2="1096" y2="180"/>
    </g>
    <g id="land" fill="#7fae62">
      <path d="M 920 120 Q 960 105 990 125 Q 995 150 970 160 Q 935 158 920 140 Z"/>
      <path d="M 1010 100 Q 1035 95 1045 112 Q 1035 130 1015 122 Z"/>
      <path d="M 930 230 Q 965 220 985 238 Q 975 262 945 258 Q 928 245 930 230 Z"/>
      <path d="M 870 160 Q 890 150 900 165 Q 892 185 875 180 Z"/>
    </g>
    <g id="pins" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#ffffff">
      <g><circle cx="960" cy="138" r="6" fill="#ffffff" stroke="#12261f" stroke-width="2"/><text x="972" y="142">上海</text></g>
      <g><circle cx="925" cy="150" r="6" fill="#ffffff" stroke="#12261f" stroke-width="2"/><text x="890" y="172">成都</text></g>
      <g><circle cx="1024" cy="110" r="6" fill="#ffffff" stroke="#12261f" stroke-width="2"/><text x="1010" y="96">东京</text></g>
      <g><circle cx="962" cy="244" r="6" fill="#ffffff" stroke="#12261f" stroke-width="2"/><text x="974" y="248">悉尼</text></g>
    </g>
  </g>
</svg>
